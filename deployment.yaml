apiVersion: apps/v1
kind: Deployment
metadata:
  name: casino-backend
  labels:
    app: casino-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: casino-backend
  template:
    metadata:
      labels:
        app: casino-backend
    spec:
      containers:
      - name: casino-backend
        image: 605493908341.dkr.ecr.us-east-1.amazonaws.com/casino-backend:latest
        ports:
        - containerPort: 3000

        envFrom:
        - secretRef:
            name: casino-secrets

        livenessProbe:
          httpGet:
            path: /livez
            port: 3000
          initialDelaySeconds: 15
        readinessProbe:
          httpGet:
            path: /readyz
            port: 3000
          initialDelaySeconds: 5
          
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi